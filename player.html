<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Player — NetflixClone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}</style>
</head>
<body class="bg-black text-white">
  <header class="p-4 flex items-center justify-between bg-black/60">
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-white/90">◀ Voltar</a>
      <a href="detalhes.html" class="text-white/70">Detalhes</a>
    </div>
    <div>
      <a href="index.html" class="text-white/90">Início</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4">
    <div id="player-wrap" class="rounded-lg overflow-hidden" style="background:#000">
      <div id="video-box" class="w-full aspect-video">
        <!-- iframe será inserido via JS -->
      </div>
    </div>

    <div id="meta" class="mt-4">
      <h1 id="video-title" class="text-2xl font-bold">Carregando...</h1>
      <p id="video-desc" class="text-gray-300 mt-2">Descrição do vídeo — clique em Detalhes para ver mais metadados.</p>
      <div class="mt-4 flex gap-2">
        <a id="open-details" class="px-4 py-2 bg-white text-black rounded" href="#">Abrir detalhes</a>
        <a id="open-youtube" class="px-4 py-2 bg-white/20 border border-white/10 rounded" target="_blank" href="#">Abrir no YouTube</a>
      </div>
    </div>
  </main>

  <script>
    // util: pegar query string
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    // mini-banco local (títulos/descs) para exibir algo decente
    const meta = {
      "wlpr0jpGGGI": { title: "wlpr0jpGGGI", desc: "Descrição do vídeo wlpr0jpGGGI." },
      "esjS0A8hwfs": { title: "esjS0A8hwfs", desc: "Descrição do vídeo esjS0A8hwfs." },
      "n-sYjHOkwIk": { title: "n-sYjHOkwIk", desc: "Descrição do vídeo n-sYjHOkwIk." },
      "818TmDjc_ak": { title: "818TmDjc_ak", desc: "Descrição do vídeo 818TmDjc_ak." },
      "GaGwd-NXyGM": { title: "GaGwd-NXyGM", desc: "Descrição do vídeo GaGwd-NXyGM." },
      "VRSyYcPRws0": { title: "VRSyYcPRws0", desc: "Descrição do vídeo VRSyYcPRws0." },
      "FedBr0CyAlE": { title: "FedBr0CyAlE", desc: "Descrição do vídeo FedBr0CyAlE." },
      "fJYkXmAdkrQ": { title: "fJYkXmAdkrQ", desc: "Descrição do vídeo fJYkXmAdkrQ." }
    };

    const vid = getQueryParam("vid");
    const videoBox = document.getElementById("video-box");
    const titleEl = document.getElementById("video-title");
    const descEl = document.getElementById("video-desc");
    const openDetails = document.getElementById("open-details");
    const openYoutube = document.getElementById("open-youtube");

    if (!vid) {
      titleEl.textContent = "Nenhum vídeo especificado";
      descEl.textContent = "Passe ?vid=ID no URL ou clique em um thumbnail na página inicial.";
      videoBox.innerHTML = `<div class="flex items-center justify-center h-full text-gray-400">Nenhum vídeo</div>`;
    } else {
      // build iframe
      const iframe = document.createElement("iframe");
      iframe.width = "100%";
      iframe.height = "100%";
      iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
      iframe.allowFullscreen = true;
      // autoplay on load
      iframe.src = `https://www.youtube.com/embed/${encodeURIComponent(vid)}?rel=0&autoplay=1`;
      iframe.className = "w-full h-full";
      videoBox.appendChild(iframe);

      const m = meta[vid] || { title: vid, desc: "Descrição não disponível." };
      titleEl.textContent = m.title;
      descEl.textContent = m.desc;

      openDetails.href = `detalhes.html?vid=${encodeURIComponent(vid)}`;
      openYoutube.href = `https://www.youtube.com/watch?v=${encodeURIComponent(vid)}`;
    }
  </script>
</body>
</html>
