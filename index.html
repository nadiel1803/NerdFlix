<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NetflixClone — Início</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  </style>
</head>
<body class="bg-background-light dark:bg-[#0f0f0f] text-white font-sans">
  <!-- Top nav -->
  <header class="flex items-center justify-between p-4 bg-gradient-to-b from-black/60 to-transparent">
    <div class="flex items-center gap-4">
      <div class="text-primary text-2xl font-bold">NetflixClone</div>
      <nav class="hidden md:flex gap-4">
        <a href="index.html" class="text-sm">Início</a>
        <a href="detalhes.html" class="text-sm">Trailers &amp; Mais</a>
        <a href="config.html" class="text-sm">Configurações</a>
      </nav>
    </div>
    <div class="flex items-center gap-3">
      <a href="config.html" class="text-sm opacity-80 hover:opacity-100">Conta</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4">
    <!-- Hero -->
    <section class="relative pb-8">
      <div class="rounded-xl overflow-hidden bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1524985069026-dd778a71c7b4?q=80&w=1920&auto=format&fit=crop'); min-height: 44vh;">
        <div class="bg-gradient-to-t from-black/80 to-transparent p-8 h-full flex flex-col justify-end">
          <h1 class="text-4xl font-extrabold">Bem-vindo ao seu clone</h1>
          <p class="text-gray-300 max-w-2xl mt-2">Navegue pelos títulos, abra a página de detalhes ou reproduza direto no player.</p>
          <div class="mt-4 flex gap-3">
            <a href="detalhes.html" class="bg-white text-black px-4 py-2 rounded font-semibold">Trailers &amp; Mais</a>
            <a href="#leon-nilce-filmes" class="bg-white/20 px-4 py-2 rounded hover:bg-white/30">Ir para LEON &amp; NILCE</a>
          </div>
        </div>
      </div>
    </section>

    <!-- Outras seções (exemplos curtos) -->
    <section class="mb-8">
      <h2 class="text-xl font-bold mb-2">Em alta</h2>
      <div class="flex gap-4 overflow-x-auto py-2">
        <!-- cards estáticos (só visual) -->
        <div class="min-w-[160px]">
          <img src="https://i.ytimg.com/vi/wlpr0jpGGGI/hqdefault.jpg" alt="" class="rounded-lg w-full" />
          <p class="text-sm mt-1">Exemplo 1</p>
        </div>
        <div class="min-w-[160px]">
          <img src="https://i.ytimg.com/vi/esjS0A8hwfs/hqdefault.jpg" alt="" class="rounded-lg w-full" />
          <p class="text-sm mt-1">Exemplo 2</p>
        </div>
      </div>
    </section>

    <!-- === SEÇÃO SOLICITADA: LEON & NILCE: FILMES === -->
    <section id="leon-nilce-filmes" class="mb-12">
      <h2 class="text-2xl font-bold mb-3">LEON &amp; NILCE: FILMES</h2>
      <div class="flex gap-4 overflow-x-auto py-2">
        <!-- Each thumbnail links to player.html?vid=VIDEO_ID and to detalhes.html?vid=VIDEO_ID via overlay buttons -->
        <div class="flex gap-3">
          <!-- repeated items -->
          <template id="thumb-template">
            <div class="min-w-[240px]">
              <div class="relative rounded-lg overflow-hidden group">
                <img class="w-full aspect-video object-cover" src="" alt="" data-id="thumb-img" />
                <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition flex items-center justify-center gap-3">
                  <a class="play-btn px-3 py-2 bg-white text-black rounded" href="#">▶</a>
                  <a class="info-btn px-3 py-2 bg-white/30 rounded text-white border border-white/20" href="#">Detalhes</a>
                </div>
              </div>
              <p class="text-sm mt-2 text-gray-200" data-id="thumb-title"></p>
            </div>
          </template>
        </div>
      </div>
    </section>
  </main>

  <footer class="p-4 text-center text-sm text-gray-400">Feito pra demo • Salve os arquivos localmente</footer>

  <script>
    // Lista dos vídeos que você enviou (IDs e títulos simples)
    const videos = [
      { id: "wlpr0jpGGGI", title: "wlpr0jpGGGI" },
      { id: "esjS0A8hwfs", title: "esjS0A8hwfs" },
      { id: "n-sYjHOkwIk", title: "n-sYjHOkwIk" },
      { id: "818TmDjc_ak", title: "818TmDjc_ak" },
      { id: "GaGwd-NXyGM", title: "GaGwd-NXyGM" },
      { id: "VRSyYcPRws0", title: "VRSyYcPRws0" },
      { id: "FedBr0CyAlE", title: "FedBr0CyAlE" },
      { id: "fJYkXmAdkrQ", title: "fJYkXmAdkrQ" }
    ];

    // Renderizar thumbnails dinamicamente
    const container = document.querySelector("#leon-nilce-filmes .flex > div");
    const tpl = document.getElementById("thumb-template");
    videos.forEach(v => {
      const clone = tpl.content.cloneNode(true);
      const img = clone.querySelector("[data-id='thumb-img']");
      const title = clone.querySelector("[data-id='thumb-title']");
      const play = clone.querySelector(".play-btn");
      const info = clone.querySelector(".info-btn");

      img.src = `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`;
      img.alt = v.title;
      title.textContent = v.title;

      // play -> player.html?vid=ID
      play.href = `player.html?vid=${encodeURIComponent(v.id)}`;

      // info -> detalhes.html?vid=ID
      info.href = `detalhes.html?vid=${encodeURIComponent(v.id)}`;

      container.appendChild(clone);
    });
  </script>
</body>
</html>
