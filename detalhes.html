<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Detalhes — NetflixClone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}</style>
</head>
<body class="bg-background-light dark:bg-[#0f0f0f] text-white">
  <header class="p-4 flex items-center justify-between bg-gradient-to-b from-black/60 to-transparent">
    <a href="index.html" class="text-white">◀ Voltar</a>
    <div class="flex gap-4">
      <a href="player.html" class="text-white/80">Player</a>
      <a href="config.html" class="text-white/80">Config</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">Trailers &amp; Vídeos</h1>

    <div class="grid md:grid-cols-3 gap-6">
      <div id="list" class="space-y-4">
        <!-- lista gerada em JS -->
      </div>

      <div id="detail" class="md:col-span-2 bg-[#111] p-4 rounded-lg">
        <div id="detail-content">
          <p class="text-gray-400">Selecione um vídeo à esquerda para ver detalhes — ou abra esta página com <code>?vid=VIDEO_ID</code>.</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    const videos = [
      { id: "wlpr0jpGGGI", title: "wlpr0jpGGGI", desc: "Descrição detalhada do vídeo wlpr0jpGGGI. Aqui dá pra colocar sinopse, elenco, ano, duração etc." },
      { id: "esjS0A8hwfs", title: "esjS0A8hwfs", desc: "Descrição detalhada do vídeo esjS0A8hwfs." },
      { id: "n-sYjHOkwIk", title: "n-sYjHOkwIk", desc: "Descrição detalhada do vídeo n-sYjHOkwIk." },
      { id: "818TmDjc_ak", title: "818TmDjc_ak", desc: "Descrição detalhada do vídeo 818TmDjc_ak." },
      { id: "GaGwd-NXyGM", title: "GaGwd-NXyGM", desc: "Descrição detalhada do vídeo GaGwd-NXyGM." },
      { id: "VRSyYcPRws0", title: "VRSyYcPRws0", desc: "Descrição detalhada do vídeo VRSyYcPRws0." },
      { id: "FedBr0CyAlE", title: "FedBr0CyAlE", desc: "Descrição detalhada do vídeo FedBr0CyAlE." },
      { id: "fJYkXmAdkrQ", title: "fJYkXmAdkrQ", desc: "Descrição detalhada do vídeo fJYkXmAdkrQ." }
    ];

    const listEl = document.getElementById("list");
    const detailEl = document.getElementById("detail-content");

    function makeListItem(v){
      const wrapper = document.createElement("div");
      wrapper.className = "flex gap-3 items-center p-2 rounded hover:bg-white/5 cursor-pointer";
      const img = document.createElement("img");
      img.src = `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`;
      img.className = "w-32 rounded";
      img.alt = v.title;
      const info = document.createElement("div");
      info.innerHTML = `<div class="font-semibold">${v.title}</div><div class="text-xs text-gray-300">Exemplo de subtítulo</div>`;
      wrapper.appendChild(img);
      wrapper.appendChild(info);

      wrapper.addEventListener("click", () => showDetail(v.id));
      return wrapper;
    }

    function showDetail(id){
      const v = videos.find(x => x.id === id);
      if(!v) return;
      detailEl.innerHTML = `
        <div class="flex flex-col md:flex-row gap-4">
          <img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="${v.title}" class="w-full md:w-1/3 rounded"/>
          <div>
            <h2 class="text-2xl font-bold">${v.title}</h2>
            <p class="text-gray-300 mt-2">${v.desc}</p>

            <div class="mt-4 flex gap-3">
              <a href="player.html?vid=${encodeURIComponent(v.id)}" class="px-4 py-2 bg-white text-black rounded">▶ Assistir</a>
              <a href="https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}" target="_blank" class="px-4 py-2 bg-white/20 border border-white/10 rounded">Abrir no YouTube</a>
            </div>

            <div class="mt-4 text-sm text-gray-400">
              <p><strong>Gênero:</strong> Documentário / Curta</p>
              <p><strong>Ano:</strong> 2023</p>
              <p><strong>Duração:</strong> 00:00</p>
            </div>
          </div>
        </div>
      `;
      // atualizar URL
      const newUrl = new URL(window.location);
      newUrl.searchParams.set("vid", id);
      window.history.replaceState({}, "", newUrl);
    }

    // renderizar lista
    videos.forEach(v => listEl.appendChild(makeListItem(v)));

    // se abriu com ?vid=... mostramos o detalhe
    const params = new URLSearchParams(window.location.search);
    const vid = params.get("vid");
    if (vid) showDetail(vid);
  </script>
</body>
</html>
